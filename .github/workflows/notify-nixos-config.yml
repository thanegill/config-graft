name: notify-nixos-config

# On push to the tracked branch, tell thanegill/nixos-config to bump this flake input
# right away — a repository_dispatch fans out to that repo's update-flake-inputs
# workflow, which narrows to the named input and opens its flake.lock bump PR
# immediately, rather than waiting for the weekly flake-input cron.
#
# client_payload.input is the input name in that flake. NIXOS_CONFIG_DISPATCH_TOKEN is
# a fine-grained PAT scoped to thanegill/nixos-config with Contents: read and write
# (the dispatch endpoint's required permission).
on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.NIXOS_CONFIG_DISPATCH_TOKEN }}
          repository: thanegill/nixos-config
          event-type: update-input
          client-payload: '{"input": "config-graft"}'
