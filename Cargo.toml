[package]
name = "config-graft"
version = "0.1.1"
edition = "2021"
description = "Three-way reconcile for app-owned JSON, plist, YAML, and TOML files"
license = "MIT"

[dependencies]
json-syntax = "0.12"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
indexmap = "2"
plist = "1"
saphyr = "0.0.6"
toml_edit = "0.22"
sha2 = "0.10"
xattr = "1"

[dev-dependencies]
# Only the reconcile tests, for their `json!(...)` fixtures.
serde_json = { version = "1", features = ["preserve_order"] }
# Only `number`'s differential test, as an arbitrary-precision oracle.
bigdecimal = "0.4"
