[package]
name = "config-graft"
version = "0.0.3"
edition = "2021"
description = "Three-way reconcile for app-owned JSON, plist, YAML, and TOML files"
license = "MIT"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
indexmap = "2"
plist = "1"
saphyr = "0.0.6"
toml_edit = "0.22"
sha2 = "0.10"
